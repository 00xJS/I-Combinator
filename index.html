<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I-Combinator</title>
    <meta name="theme-color" content="#0a0d1c">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖼️</text></svg>">
    <style>
        /* ===== Observation Deck design tokens (dark only) ===== */
        :root {
            /* dark-only by design — native controls stay dark regardless of OS theme */
            color-scheme: dark;

            /* surfaces */
            --bg: #0a0d1c;
            --bg-raised: #10142e;
            --card: #12163a;
            --card-chrome: #0c0f26;
            --border: rgba(255, 255, 255, 0.09);
            /* Interactive-control boundaries only. The subtle --border is
               1.28:1 on --card, but WCAG 1.4.11 wants 3:1 for anything that
               identifies a control. This measures 3.48:1 on --card and
               3.60:1 on --bg-raised (the fill it sits against). */
            --border-control: #656d96;
            --border-hover: rgba(255, 154, 68, 0.55);

            /* text */
            --text: #e8eaf6;
            --muted: #9ba1c5;
            /* lightened from the deck's #6c7299, which was 3.75:1 on --card —
               below AA for the kicker, h2, footer and placeholder text */
            --faint: #7e84ad;

            /* accents */
            --accent: #ff9a44;
            --accent-deep: #e8792b;
            --magenta: #c23e8c;

            /* semantic */
            --live: #3ddc84;
            --warn: #ffc24b;
            --down: #ff6b6b;

            /* components */
            --tag-bg: rgba(255, 154, 68, 0.10);
            --tag-text: #ffb877;
            --shadow: 0 14px 40px rgba(0, 0, 0, 0.45);
            --btn-ink: #0a0d1c;
            --btc: #f7931a;

            /* type */
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", sans-serif;
            --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;

            /* shape */
            --radius-card: 12px;
            --radius-control: 8px;
            --radius-pill: 999px;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            margin: 20px;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* ambient glow */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background:
                radial-gradient(900px 480px at 15% -10%, rgba(232, 121, 43, 0.10), transparent 60%),
                radial-gradient(800px 480px at 90% 0%, rgba(194, 62, 140, 0.09), transparent 60%);
        }

        ::selection {
            background: var(--accent-deep);
            /* dark ink, not white: #fff on this orange is only 2.92:1 */
            color: var(--btn-ink);
        }

        [hidden] {
            display: none !important;
        }

        .container {
            max-width: 800px;
            margin: auto;
            padding: 28px 24px;
            background: var(--card);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            border-radius: var(--radius-card);
        }

        .kicker {
            text-align: center;
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--faint);
            margin: 0 0 10px;
        }

        .kicker a {
            color: var(--faint);
            text-decoration: none;
        }

        .kicker a:hover {
            color: var(--accent);
        }

        h1 {
            text-align: center;
            margin: 0 0 4px;
            font-weight: 700;
        }

        h2 {
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--faint);
            margin: 0 0 12px;
        }

        .tagline {
            text-align: center;
            color: var(--muted);
            margin: 0 0 24px;
        }

        a {
            color: var(--accent);
        }

        a:hover {
            color: var(--accent-deep);
        }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        button,
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 9px 16px;
            font-size: 14px;
            font-weight: 600;
            font-family: var(--font-sans);
            min-height: 44px;
            cursor: pointer;
            background: var(--accent);
            color: var(--btn-ink);
            border: none;
            border-radius: var(--radius-control);
            text-decoration: none;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        button:hover,
        .btn:hover {
            background: var(--accent-deep);
            transform: translateY(-1px);
        }

        button:active,
        .btn:active {
            transform: translateY(0);
        }

        .drop-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            width: 100%;
            padding: 32px 16px;
            background: var(--bg-raised);
            color: var(--text);
            border: 2px dashed var(--border-control);
            border-radius: var(--radius-card);
            transition: border-color 0.2s ease, background 0.2s ease;
        }

        .drop-zone:hover,
        .drop-zone.drag-active {
            background: var(--bg-raised);
            border-color: var(--border-hover);
            color: var(--text);
            transform: none;
        }

        .drop-zone strong {
            color: var(--accent);
            font-size: 18px;
        }

        .drop-zone span {
            color: var(--muted);
            font-size: 14px;
            font-weight: 400;
        }

        .thumb-list {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            list-style: none;
            margin: 16px 0 0;
            padding: 0;
        }

        .thumb-list:empty {
            margin: 0;
        }

        .thumb {
            position: relative;
            width: 112px;
        }

        .thumb img {
            display: block;
            width: 112px;
            height: 112px;
            object-fit: cover;
            border: 1px solid var(--border);
            border-radius: var(--radius-control);
        }

        .thumb .badge {
            position: absolute;
            top: 4px;
            left: 4px;
            min-width: 22px;
            text-align: center;
            padding: 2px 7px;
            border-radius: var(--radius-pill);
            background: rgba(10, 13, 28, 0.75);
            color: #fff;
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: 0.08em;
            font-weight: 700;
        }

        .thumb-btn {
            min-height: 40px;
            min-width: 40px;
            padding: 4px;
            font-size: 14px;
            border-radius: var(--radius-control);
            background: var(--bg-raised);
            color: var(--text);
            border: 1px solid var(--border-control);
        }

        .thumb-btn:hover {
            background: var(--bg-raised);
            border-color: var(--border-hover);
        }

        .thumb .remove {
            position: absolute;
            top: 4px;
            right: 4px;
            min-height: 30px;
            min-width: 30px;
            border-radius: 50%;
            font-size: 13px;
            background: rgba(10, 13, 28, 0.75);
            color: #fff;
            border: none;
        }

        .thumb .remove:hover {
            background: var(--down);
            color: var(--btn-ink);
        }

        .thumb-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 6px;
        }

        .thumb-btn:disabled {
            /* 0.35 read as "absent" rather than "disabled" — still clearly
               de-emphasised against the enabled state at 0.5 */
            opacity: 0.5;
            cursor: default;
        }

        .thumb-btn:disabled:hover {
            background: var(--bg-raised);
            border-color: var(--border-control);
            transform: none;
        }

        .controls-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 14px;
            margin: 20px 0;
        }

        .control-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
            letter-spacing: 0.02em;
            margin-bottom: 5px;
        }

        input,
        select {
            width: 100%;
            padding: 8px 10px;
            /* 16px, not the deck's 14px: below 16px iOS Safari zooms on focus */
            font-size: 16px;
            font-family: var(--font-sans);
            min-height: 44px;
            color: var(--text);
            background: var(--bg-raised);
            border: 1px solid var(--border-control);
            border-radius: var(--radius-control);
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(255, 154, 68, 0.18);
        }

        /* Popups drawn as OS chrome follow the OS, not color-scheme — without
           this, a light-mode user gets light option text on a white menu */
        option,
        optgroup {
            background-color: var(--bg-raised);
            color: var(--text);
        }

        input[type="color"] {
            padding: 4px;
            cursor: pointer;
        }

        input[type="range"] {
            padding: 0;
            border: none;
            background: none;
            accent-color: var(--accent);
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            margin: 12px 8px 12px 0;
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-pill);
            background: var(--bg-raised);
            color: var(--muted);
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-variant-numeric: tabular-nums;
        }

        .status .dot {
            flex: none;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--faint);
        }

        .status.ok {
            color: var(--live);
        }

        .status.ok .dot {
            background: var(--live);
            box-shadow: 0 0 8px var(--live);
            animation: deck-pulse 2.4s ease-in-out infinite;
        }

        .status.down {
            color: var(--down);
        }

        .status.down .dot {
            background: var(--down);
            box-shadow: 0 0 8px var(--down);
        }

        @keyframes deck-pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.35;
            }
        }

        .placeholder {
            border: 2px dashed var(--border);
            border-radius: var(--radius-card);
            padding: 48px 16px;
            text-align: center;
            color: var(--faint);
        }

        #resultImage {
            max-width: 100%;
            border: 1px solid var(--border);
            border-radius: var(--radius-control);
        }

        .result-actions {
            display: flex;
            justify-content: center;
            margin-top: 16px;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            padding: 10px 10px 0;
            border-top: 1px solid var(--border);
            color: var(--faint);
            font-size: 13px;
        }

        /* flex, so separator spacing is explicit and markup whitespace can't
           add to it — links keep their vertical padding for a 44px target */
        .footer p {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 0 8px;
        }

        .footer a {
            padding: 12px 0;
            color: var(--accent);
            text-decoration: none;
        }

        .footer .sep {
            color: var(--faint);
            user-select: none;
        }

        .footer a:hover {
            color: var(--accent-deep);
            text-decoration: underline;
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
            }
        }

        @media (max-width: 480px) {
            body {
                margin: 8px;
            }

            .container {
                padding: 16px;
            }

            .thumb {
                width: 88px;
            }

            .thumb img {
                width: 88px;
                height: 88px;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <p class="kicker"><a href="https://observation-deck.netlify.app/">Observation Deck</a> / I-Combinator</p>
        <h1>I-Combinator</h1>
        <p class="tagline">Combine images side by side or stacked — runs entirely in your browser.</p>

        <button type="button" id="dropZone" class="drop-zone">
            <strong>Choose images</strong>
            <span>or drag &amp; drop anywhere — or paste (Ctrl/Cmd+V)</span>
        </button>
        <input type="file" id="fileInput" accept="image/*" multiple hidden>

        <ul id="thumbList" class="thumb-list" aria-label="Selected images"></ul>

        <div class="controls-row">
            <div class="control-group">
                <label for="orientation">Orientation</label>
                <select id="orientation">
                    <option value="horizontal">Horizontal (side by side)</option>
                    <option value="vertical">Vertical (stacked)</option>
                </select>
            </div>
            <div class="control-group">
                <label for="sizing">Sizing</label>
                <select id="sizing">
                    <option value="smallest">Match smallest image</option>
                    <option value="largest">Match largest image</option>
                    <option value="original">Keep original sizes</option>
                </select>
            </div>
            <div class="control-group">
                <label for="gap">Gap (px)</label>
                <input type="number" id="gap" min="0" max="1000" step="1" value="0">
            </div>
            <div class="control-group">
                <label for="bgColor">Background</label>
                <input type="color" id="bgColor" value="#ffffff">
            </div>
            <div class="control-group">
                <label for="format">Format</label>
                <select id="format">
                    <option value="image/jpeg">JPEG</option>
                    <option value="image/png">PNG</option>
                    <option value="image/webp">WebP</option>
                </select>
            </div>
            <div class="control-group" id="qualityGroup">
                <label for="quality">Quality (<span id="qualityVal">92%</span>)</label>
                <input type="range" id="quality" min="0.1" max="1" step="0.01" value="0.92">
            </div>
        </div>

        <p id="statusError" class="status down" role="alert" hidden><span class="dot"></span><span id="statusErrorText"></span></p>
        <p id="statusInfo" class="status" role="status"><span class="dot"></span><span id="statusInfoText">Add images to get started.</span></p>

        <div id="placeholder" class="placeholder">Your stitched image will appear here.</div>
        <section id="resultSection" hidden>
            <h2>Result</h2>
            <img id="resultImage" alt="">
            <div class="result-actions">
                <a id="downloadBtn" class="btn">Download</a>
            </div>
        </section>

        <footer class="footer">
            <p>
                <a href="https://observation-deck.netlify.app/">Observation Deck</a>
                <span class="sep" aria-hidden="true">·</span>
                <span>JS</span>
                <span class="sep" aria-hidden="true">·</span>
                <a href="https://github.com/00xJS/I-Combinator">Project GitHub</a>
            </p>
        </footer>
    </main>

    <script>
        const $ = id => document.getElementById(id);
        const MAX_SIDE = 16384;
        const SETTINGS_KEY = 'i-combinator-settings';
        const EXT = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp' };

        let images = [];
        let uid = 0;
        let dragIndex = null;
        let stitchTimer = null;
        let stitchToken = 0;
        let resultURL = null;
        let exportError = false;
        let addQueue = Promise.resolve();

        function setError(msg) {
            $('statusErrorText').textContent = msg;
            $('statusError').hidden = !msg;
        }

        function setInfo(msg, ok) {
            $('statusInfoText').textContent = msg;
            $('statusInfo').classList.toggle('ok', !!ok);
        }

        async function loadImage(file) {
            if (!file.type.startsWith('image/')) {
                throw new Error(`Skipped "${file.name}" — not an image file.`);
            }
            const url = URL.createObjectURL(file);
            const img = new Image();
            try {
                // onload/onerror rather than decode(): decode() is deferred
                // indefinitely while the tab is hidden
                await new Promise((resolve, reject) => {
                    img.onload = resolve;
                    img.onerror = reject;
                    img.src = url;
                });
            } catch {
                URL.revokeObjectURL(url);
                throw new Error(`Skipped "${file.name}" — couldn't be read as an image.`);
            }
            if (!img.naturalWidth || !img.naturalHeight) {
                URL.revokeObjectURL(url);
                throw new Error(`Skipped "${file.name}" — it has no usable dimensions.`);
            }
            return { id: ++uid, file, url, img, name: file.name };
        }

        function addFiles(fileList) {
            // Capture synchronously (a live FileList empties when the input resets),
            // then serialize batches so a quick drop+paste can't interleave ordering
            const files = [...fileList];
            if (!files.length) return addQueue;
            addQueue = addQueue.then(async () => {
                const errors = [];
                for (const file of files) {
                    try {
                        images.push(await loadImage(file));
                    } catch (e) {
                        errors.push(e.message);
                    }
                }
                setError(errors.join(' '));
                renderThumbs();
                scheduleStitch();
            });
            return addQueue;
        }

        function removeImage(id) {
            const i = images.findIndex(o => o.id === id);
            if (i === -1) return;
            URL.revokeObjectURL(images[i].url);
            images.splice(i, 1);
            renderThumbs();
            // Keep keyboard focus in the list after the button under focus disappears
            const removeBtns = document.querySelectorAll('.thumb .remove');
            const target = removeBtns[Math.min(i, removeBtns.length - 1)];
            (target || $('dropZone')).focus();
            scheduleStitch();
        }

        function moveImage(id, delta) {
            const i = images.findIndex(o => o.id === id);
            const j = i + delta;
            if (i === -1 || j < 0 || j >= images.length) return;
            [images[i], images[j]] = [images[j], images[i]];
            renderThumbs({ id, cls: delta < 0 ? 'move-earlier' : 'move-later' });
            scheduleStitch();
        }

        function reorder(from, to) {
            if (from === null || from === to || from < 0 || to < 0) return;
            const [moved] = images.splice(from, 1);
            images.splice(to, 0, moved);
            renderThumbs();
            scheduleStitch();
        }

        function renderThumbs(focusSpec) {
            const list = $('thumbList');
            list.textContent = '';
            images.forEach((o, i) => {
                const li = document.createElement('li');
                li.className = 'thumb';
                li.draggable = true;
                li.dataset.id = o.id;

                const img = document.createElement('img');
                img.src = o.url;
                img.alt = `Image ${i + 1}: ${o.name}`;
                img.title = o.name;
                // Otherwise the img (draggable by default) becomes the drag source
                // and carries a Files payload that reads as an external file drop
                img.draggable = false;

                const badge = document.createElement('span');
                badge.className = 'badge';
                badge.textContent = i + 1;

                const remove = document.createElement('button');
                remove.type = 'button';
                remove.className = 'thumb-btn remove';
                remove.textContent = '✕';
                remove.setAttribute('aria-label', `Remove image ${i + 1} (${o.name})`);
                remove.addEventListener('click', () => removeImage(o.id));

                const actions = document.createElement('div');
                actions.className = 'thumb-actions';
                const earlier = document.createElement('button');
                earlier.type = 'button';
                earlier.className = 'thumb-btn move-earlier';
                earlier.textContent = '◀';
                earlier.disabled = i === 0;
                earlier.setAttribute('aria-label', `Move image ${i + 1} (${o.name}) earlier`);
                earlier.addEventListener('click', () => moveImage(o.id, -1));
                const later = document.createElement('button');
                later.type = 'button';
                later.className = 'thumb-btn move-later';
                later.textContent = '▶';
                later.disabled = i === images.length - 1;
                later.setAttribute('aria-label', `Move image ${i + 1} (${o.name}) later`);
                later.addEventListener('click', () => moveImage(o.id, 1));
                actions.append(earlier, later);

                li.addEventListener('dragstart', e => {
                    dragIndex = i;
                    e.dataTransfer.effectAllowed = 'move';
                    e.dataTransfer.setData('text/plain', String(i));
                });
                li.addEventListener('dragend', () => { dragIndex = null; });
                li.addEventListener('dragover', e => e.preventDefault());
                li.addEventListener('drop', e => {
                    // Only intercept internal reorders — OS file drops on a
                    // thumbnail must bubble to the document handler
                    if (dragIndex === null) return;
                    e.preventDefault();
                    e.stopPropagation();
                    reorder(dragIndex, i);
                    dragIndex = null;
                });

                li.append(img, badge, remove, actions);
                list.appendChild(li);
            });
            if (focusSpec) {
                const btn = list.querySelector(`[data-id="${focusSpec.id}"] .${focusSpec.cls}`);
                // If the item landed at an end its button is now disabled —
                // keep keyboard focus on the sibling instead of dropping to <body>
                if (btn) (btn.disabled ? btn.parentElement.querySelector('button:not(:disabled)') : btn).focus();
            }
        }

        function scheduleStitch() {
            clearTimeout(stitchTimer);
            stitchTimer = setTimeout(stitch, 200);
        }

        async function stitch() {
            const token = ++stitchToken;
            if (!images.length) {
                if (resultURL) {
                    URL.revokeObjectURL(resultURL);
                    resultURL = null;
                }
                $('resultImage').removeAttribute('src');
                $('downloadBtn').removeAttribute('href');
                $('resultSection').hidden = true;
                $('placeholder').hidden = false;
                setError('');
                exportError = false;
                setInfo('Add images to get started.');
                return;
            }

            const horiz = $('orientation').value === 'horizontal';
            const sizing = $('sizing').value;
            const gap = Math.min(Math.max(parseInt($('gap').value, 10) || 0, 0), 1000);
            const cross = img => horiz ? img.naturalHeight : img.naturalWidth;

            let target = null;
            if (sizing === 'smallest') target = Math.min(...images.map(o => cross(o.img)));
            if (sizing === 'largest') target = Math.max(...images.map(o => cross(o.img)));

            const draws = images.map(o => {
                const { naturalWidth: w, naturalHeight: h } = o.img;
                if (target === null) return { img: o.img, w, h };
                const s = target / cross(o.img);
                return { img: o.img, w: w * s, h: h * s };
            });

            const mainTotal = draws.reduce((sum, d) => sum + (horiz ? d.w : d.h), 0) + gap * (draws.length - 1);
            const crossTotal = target !== null ? target : Math.max(...draws.map(d => horiz ? d.h : d.w));
            const width = horiz ? mainTotal : crossTotal;
            const height = horiz ? crossTotal : mainTotal;

            // Browsers cap canvas size (per-side everywhere, total area on iOS)
            // and fail SILENTLY past the limit — so draw, verify a pixel came out
            // opaque, and retry at half scale until the canvas is actually live
            let scale = Math.min(1, MAX_SIDE / width, MAX_SIDE / height);
            let canvas = null;
            for (let attempt = 0; attempt < 4; attempt++) {
                const c = document.createElement('canvas');
                c.width = Math.max(1, Math.round(width * scale));
                c.height = Math.max(1, Math.round(height * scale));
                const ctx = c.getContext('2d');
                ctx.fillStyle = $('bgColor').value;
                ctx.fillRect(0, 0, c.width, c.height);

                let offset = 0;
                for (const d of draws) {
                    const w = d.w * scale, h = d.h * scale;
                    if (horiz) {
                        ctx.drawImage(d.img, offset, 0, w, h);
                        offset += w + gap * scale;
                    } else {
                        ctx.drawImage(d.img, 0, offset, w, h);
                        offset += h + gap * scale;
                    }
                }
                if (canvasAlive(ctx)) {
                    canvas = c;
                    break;
                }
                scale /= 2;
            }
            if (!canvas) {
                exportError = true;
                setError('This stitch is too large for your browser — try fewer or smaller images.');
                return;
            }

            const format = $('format').value;
            const quality = parseFloat($('quality').value) || 0.92;
            const blob = await new Promise(resolve => canvas.toBlob(resolve, format, quality));
            if (token !== stitchToken) return;
            if (!blob) {
                exportError = true;
                setError('Export failed — try fewer or smaller images.');
                return;
            }
            if (exportError) {
                // A later stitch succeeded — retire the stale export error
                // (skipped-file notices from addFiles are left alone)
                setError('');
                exportError = false;
            }

            if (resultURL) URL.revokeObjectURL(resultURL);
            resultURL = URL.createObjectURL(blob);
            const resultImage = $('resultImage');
            resultImage.src = resultURL;
            resultImage.alt = `Stitched result: ${images.length} image${images.length === 1 ? '' : 's'} ` +
                `${horiz ? 'side by side' : 'stacked vertically'}, ${canvas.width} by ${canvas.height} pixels`;

            // Safari falls back to PNG when WebP isn't supported — trust the blob's real type
            const actualExt = EXT[blob.type] || 'png';
            const d = new Date();
            const pad = n => String(n).padStart(2, '0');
            const stamp = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}`;
            $('downloadBtn').href = resultURL;
            $('downloadBtn').download = `stitched_${stamp}.${actualExt}`;

            $('placeholder').hidden = true;
            $('resultSection').hidden = false;
            const fallback = blob.type !== format ? ` Saved as ${actualExt.toUpperCase()} (this browser doesn't support the chosen format).` : '';
            const scaled = scale < 1 ? ' Scaled down to fit browser canvas limits.' : '';
            setInfo(`Stitched ${images.length} image${images.length === 1 ? '' : 's'} ` +
                `${horiz ? 'horizontally' : 'vertically'} — ${canvas.width}×${canvas.height}px. Download ready.${scaled}${fallback}`, true);
        }

        function canvasAlive(ctx) {
            try {
                return ctx.getImageData(0, 0, 1, 1).data[3] === 255;
            } catch {
                return false;
            }
        }

        function syncQualityVisibility() {
            $('qualityGroup').hidden = $('format').value === 'image/png';
        }

        function saveSettings() {
            try {
                localStorage.setItem(SETTINGS_KEY, JSON.stringify({
                    orientation: $('orientation').value,
                    sizing: $('sizing').value,
                    gap: String(Math.min(Math.max(parseInt($('gap').value, 10) || 0, 0), 1000)),
                    bgColor: $('bgColor').value,
                    format: $('format').value,
                    quality: $('quality').value,
                }));
            } catch { /* private browsing — settings just won't persist */ }
        }

        function loadSettings() {
            try {
                const s = JSON.parse(localStorage.getItem(SETTINGS_KEY));
                if (!s) return;
                for (const id of ['orientation', 'sizing', 'gap', 'bgColor', 'format', 'quality']) {
                    if (s[id] !== undefined) $(id).value = s[id];
                }
            } catch { /* ignore corrupt settings */ }
        }

        $('dropZone').addEventListener('click', () => $('fileInput').click());
        $('fileInput').addEventListener('change', e => {
            addFiles(e.target.files);
            e.target.value = '';
        });

        let dragDepth = 0;
        const hasFiles = e => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
        document.addEventListener('dragenter', e => {
            if (hasFiles(e)) {
                dragDepth++;
                $('dropZone').classList.add('drag-active');
            }
        });
        document.addEventListener('dragleave', () => {
            if (--dragDepth <= 0) {
                dragDepth = 0;
                $('dropZone').classList.remove('drag-active');
            }
        });
        document.addEventListener('dragover', e => e.preventDefault());
        document.addEventListener('drop', e => {
            e.preventDefault();
            dragDepth = 0;
            $('dropZone').classList.remove('drag-active');
            // A reorder drag released outside the list must not re-add its image
            if (dragIndex !== null) {
                dragIndex = null;
                return;
            }
            if (e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
        });

        document.addEventListener('paste', e => {
            const files = [...((e.clipboardData && e.clipboardData.items) || [])]
                .filter(item => item.kind === 'file' && item.type.startsWith('image/'))
                .map(item => item.getAsFile())
                .filter(Boolean);
            if (files.length) {
                e.preventDefault();
                addFiles(files);
            }
        });

        for (const id of ['orientation', 'sizing', 'gap', 'bgColor', 'format', 'quality']) {
            $(id).addEventListener('input', () => {
                if (id === 'format') syncQualityVisibility();
                if (id === 'quality') $('qualityVal').textContent = Math.round($('quality').value * 100) + '%';
                saveSettings();
                scheduleStitch();
            });
        }

        loadSettings();
        syncQualityVisibility();
        $('qualityVal').textContent = Math.round($('quality').value * 100) + '%';
    </script>
</body>

</html>
